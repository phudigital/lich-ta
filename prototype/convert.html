<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Ta - Đổi ngày</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fbfaf6; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24 lg:pb-8">

    <!-- Mobile Header -->
    <header class="glass-header sticky top-0 z-50 border-b border-slate-200/60 px-4 py-3 flex items-center justify-between lg:px-8 lg:py-4">
        <a href="index.html" class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-700 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-sm">
                LT
            </div>
            <div>
                <h1 class="font-bold leading-tight">Lịch Ta</h1>
                <p class="text-xs text-slate-500 font-medium">Âm lịch Việt Nam</p>
            </div>
        </a>
        <div class="hidden lg:flex items-center gap-1 bg-emerald-50 p-1 rounded-full border border-emerald-100">
            <a href="index.html" class="px-4 py-2 text-slate-600 hover:text-emerald-700 rounded-full text-sm font-semibold transition-colors">Hôm nay</a>
            <a href="month.html" class="px-4 py-2 text-slate-600 hover:text-emerald-700 rounded-full text-sm font-semibold transition-colors">Lịch tháng</a>
            <a href="convert.html" class="px-4 py-2 bg-white text-emerald-800 rounded-full text-sm font-bold shadow-sm">Đổi ngày</a>
            <a href="almanac.html" class="px-4 py-2 text-slate-600 hover:text-emerald-700 rounded-full text-sm font-semibold transition-colors">Thông Thư</a>
        </div>
        <button class="lg:hidden p-2 text-slate-600 bg-slate-100 rounded-full">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 lg:mt-12">
        
        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-200">
            <div class="text-center mb-8">
                <span class="inline-block px-3 py-1 bg-purple-100 text-purple-700 text-xs font-bold uppercase tracking-wider rounded-full mb-4">Công cụ</span>
                <h2 class="text-2xl md:text-3xl font-bold mb-2">Đổi ngày âm dương</h2>
                <p class="text-slate-500">Chuyển đổi nhanh chóng giữa dương lịch và âm lịch Việt Nam</p>
            </div>

            <!-- Direction Toggle -->
            <div class="flex justify-center mb-8">
                <div class="flex p-1 bg-slate-100 rounded-xl">
                    <button class="px-6 py-2.5 bg-white rounded-lg shadow-sm text-sm font-bold text-slate-800">Dương → Âm</button>
                    <button class="px-6 py-2.5 text-sm font-semibold text-slate-500 hover:text-slate-700">Âm → Dương</button>
                </div>
            </div>

            <!-- Input Form -->
            <div class="grid grid-cols-3 gap-3 md:gap-4 mb-6">
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-2">Ngày</label>
                    <input type="number" value="28" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 md:py-4 text-center font-bold text-lg focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-2">Tháng</label>
                    <input type="number" value="5" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 md:py-4 text-center font-bold text-lg focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-2">Năm</label>
                    <input type="number" value="2026" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 md:py-4 text-center font-bold text-lg focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500">
                </div>
            </div>

            <button class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl transition-colors text-lg flex items-center justify-center gap-2 mb-8">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                Chuyển đổi
            </button>

            <!-- Result Area -->
            <div class="bg-purple-50 border border-purple-100 rounded-2xl p-6 text-center">
                <p class="text-purple-600 font-semibold mb-2">Kết quả (Âm lịch)</p>
                <div class="text-4xl md:text-5xl font-black text-purple-900 mb-2">12/04/2026</div>
                <p class="text-purple-700 font-medium">Năm Bính Ngọ · Tháng Quý Tỵ · Ngày Mậu Thân</p>
                
                <div class="mt-6 flex justify-center">
                    <button class="px-6 py-2 bg-white text-purple-700 border border-purple-200 rounded-full text-sm font-bold shadow-sm hover:bg-purple-50 transition-colors">
                        Xem chi tiết ngày này
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 pb-safe pt-2 px-6 flex justify-between items-center z-50">
        <a href="index.html" class="flex flex-col items-center gap-1 text-slate-400 w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] font-semibold">Hôm nay</span>
        </a>
        <a href="month.html" class="flex flex-col items-center gap-1 text-slate-400 w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-[10px] font-semibold">Tháng</span>
        </a>
        <a href="convert.html" class="flex flex-col items-center gap-1 text-emerald-700 w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            <span class="text-[10px] font-bold">Đổi ngày</span>
        </a>
        <a href="almanac.html" class="flex flex-col items-center gap-1 text-slate-400 w-16">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            <span class="text-[10px] font-semibold">Thông Thư</span>
        </a>
    </nav>
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</body>
</html>
